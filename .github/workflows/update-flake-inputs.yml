name: Update flake inputs

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        run: |
          {
            nix flake update nixpkgs-rolling
            nix flake update claude-code-nix
            nix flake update codex-cli-nix
            nix flake update llm-agents
            nix flake update autolith
            nix flake update nix-omp
          } 2>&1 | tee /tmp/update-output.txt
          {
            echo "UPDATE_OUTPUT<<EOF"
            cat /tmp/update-output.txt
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: |
            flake: update nixpkgs-rolling, claude-code-nix, codex-cli-nix, llm-agents.nix, nix-omp, and autolith inputs

            ${{ env.UPDATE_OUTPUT }}
          title: "flake: update nixpkgs-rolling, claude-code-nix, codex-cli-nix, llm-agents.nix, nix-omp, and autolith inputs"
          body: |
            Automated daily update of flake inputs:
            - `nixpkgs-rolling`
            - `claude-code-nix`
            - `codex-cli-nix`
            - `llm-agents.nix`
            - `autolith`
            - `nix-omp`
          branch: auto-update-flake-inputs
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
